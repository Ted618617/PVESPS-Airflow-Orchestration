# docker-compose.airflow.yml
#
# PVESPS-Airflow-Orchestration
# Step_11_airflow_排程管理
#
# Phase 1 目標：
# 1. 啟動 Airflow Web UI
# 2. 掃描 dags/pvesps_daily_pipeline.py
# 3. 手動 Trigger DAG 成功
#
# 注意：
# - 此設定用於本機開發 / 作品集展示，不是 production 設定。
# - Airflow metadata DB 使用獨立的 postgres service。
# - 不對外映射 metadata postgres 的 5432，避免與既有 postgres_db 衝突。
# - PVESPS 專案資料庫 pvesps_airflow_dw 仍使用你現有的 Docker postgres_db：
#   host.docker.internal:5432 / username / password / pvesps_airflow_dw

x-airflow-common: &airflow-common
  image: apache/airflow:3.2.1
  environment: &airflow-common-env
    # Airflow metadata database
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow

    # Executor
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    # Basic settings
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Taipei
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
    # Set AIRFLOW_JWT_SECRET in the local .env; never commit the real value.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-replace-with-a-local-64-character-secret}
    
     # Airflow 3 Simple Auth Manager    
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json

    # Airflow 3 API auth setting for local development
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth

    # Optional: allow simple local testing
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"

    # PVESPS V2 database connection
    PVESPS_DATABASE_URL: postgresql+psycopg2://username:password@host.docker.internal:5432/pvesps_airflow_dw
    DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://username:password@host.docker.internal:5432/pvesps_airflow_dw}
    CWA_API_KEY: ${CWA_API_KEY:-}

    # Python path for mounted scripts
    PYTHONPATH: /opt/airflow

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./scripts:/opt/airflow/scripts
    - ..:/opt/pvesps:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  airflow-postgres:
    image: postgres:16
    container_name: pvesps_airflow_metadata_db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: pvesps_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Initializing Airflow metadata database..."
        airflow db migrate

        echo "Airflow initialization completed."
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: pvesps_airflow_webserver
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: pvesps_airflow_scheduler
    hostname: pvesps_airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
        
  airflow-dag-processor:
    <<: *airflow-common
    container_name: pvesps_airflow_dag_processor
    command: dag-processor
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-postgres-db-volume:


